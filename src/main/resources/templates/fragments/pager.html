<div class="col-6">
    <th:block th:if="${maxPages > 0}">
    <div class="row aln-center">
        <div class="col-2 aln-center">
            <form method="GET">
                <input type="hidden" name="page" th:value="${page - 1}"/>
                <input type="hidden" name="perPage" th:value="${perPage}"/>
                <button type="submit" style="height:40px;" class="material-symbols-outlined page-btn" th:disabled="${page <= 0}">
                arrow_back
                </button>
            </form>
        </div>
        <div class="col-2 aln-center">
            <h3 class="page-txt" th:text="${(page+1) + '/' + (maxPages+1)}" style="text-align:center;"></h3>
        </div>
        <div class="col-2 aln-center">
            <form method="GET">
                <input type="hidden" name="page" th:value="${page + 1}"/>
                <input type="hidden" name="perPage" th:value="${perPage}"/>
                <button type="submit" style="height:40px;" class="material-symbols-outlined page-btn" th:disabled="${page >= maxPages}">
                    arrow_forward
                </button>
            </form>
        </div>
    </div>
    </th:block>
</div>
